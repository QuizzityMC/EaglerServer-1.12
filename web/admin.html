<!DOCTYPE html>
<html>
  <head>
    <title>Server File Editor</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      textarea {
        width: 100%;
        height: 400px;
        font-family: monospace;
      }
      button {
        margin-top: 10px;
        padding: 8px 20px;
      }
    </style>
  </head>
  <body>
    <h2>Editing Server File (.yml / .properties)</h2>
    <textarea id="editor" placeholder="Loading..."></textarea>
    <br />
    <button onclick="saveFile()">Save Changes</button>
    <p id="status"></p>

    <script>
      const Editor = document.getElementById("editor");
      const status = document.getElementById("status");

      // Load file from server
      fetch("http://localhost:3000/file")
        .then((res) => res.text())
        .then((data) => {
          editor.value = data;
        });

      // Save edited file back to server
      function saveFile() {
        fetch("http://localhost:3000/file", {
          method: "POST",
          headers: {
            "Content-Type": "text/plain",
          },
          body: editor.value,
        })
          .then((res) => res.text())
          .then((msg) => {
            status.textContent = msg;
            status.style.color = "green";
          })
          .catch((err) => {
            status.textContent = "Error saving file";
            status.style.color = "red";
          });
      }
    </script>
  </body>
</html>
<!DOCTYPE html>
<html>
  <head>
    <title>File Editor</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #f7f7f7;
      }
      textarea {
        width: 100%;
        height: 400px;
        font-family: monospace;
      }
      button {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Edit .properties or .yml File</h2>

    <input type="file" id="fileInput" accept=".properties,.yml,.yaml" />
    <br /><br />
    <textarea
      id="editor"
      placeholder="Your file content will appear here..."
    ></textarea>
    <br />
    <button onclick="saveFile()">Save</button>

    <script>
      const fileInput = document.getElementById("fileInput");
      const editor = document.getElementById("editor");
      let currentFileName = "edited-file";

      fileInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        currentFileName = file.name;
        const reader = new FileReader();
        reader.onload = function (e) {
          editor.value = e.target.result;
        };
        reader.readAsText(file);
      });

      function saveFile() {
        const blob = new Blob([editor.value], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = currentFileName;
        a.click();
      }
    </script>
  </body>
</html>
