<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supreme Waffle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #141414; 
      color: #eee;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #1b0000; 
      border-bottom: 2px solid #ff0000; 
    }

    nav .left-icon {
      width: 40px;
      height: 40px;
      background: url('./icons/logo.png') no-repeat center/contain;
      cursor: default;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    nav ul li {
      cursor: pointer;
      font-weight: 600;
      color: #ff0000;
      transition: color 0.3s ease;
    }

    nav ul li:hover {
      color: #ff6666;
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }

    main .server-icon {
      width: 100px;
      height: 100px;
      background: url('./icons/logo.png') no-repeat center/contain;
      margin-bottom: 1rem;
    }

    main h1 {
      font-size: 3rem;
      color: #ff0000;
      text-shadow: 1px 1px 5px #550000;
    }

    main p {
      font-size: 1.2rem;
      color: #ccc;
      margin-bottom: 2rem;
    }

    main button {
      padding: 0.75rem 2rem;
      font-size: 1.2rem;
      font-weight: 700;
      background-color: #ff0000;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 10px #ff0000aa;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    main button:hover {
      background-color: #cc0000;
      box-shadow: 0 0 15px #ff4444;
    }
  </style>
</head>
<body>

  <nav>
    <div class="left-icon" title="Supreme Waffle Icon"></div>
    <ul>
      <li onclick="navigateHome()">Home</li>
      <li onclick="navigateGame()">Enter Server</li>
      <li onclick="navigateServerStatus()">Server Status</li>
    </ul>
  </nav>

  <main>
    <div class="server-icon" title="Minecraft Icon"></div>
    <h1>Supreme Waffle</h1>
    <p>Local LWPS Server</p>
    <button id="enterServerBtn">Enter Server</button>
  </main>

  <script>
    function navigateHome() {
      window.location.href = 'index.html';
    }
    function navigateGame() {
      window.location.href = 'minecraft';
    }
    function navigateServerStatus() {
      window.location.href = 'server-status.html';
    }

    document.getElementById('enterServerBtn').addEventListener('click', () => {
      window.location.href = 'minecraft';
    });
  </script>

</body>
</html>
